openapi: 3.0.3
info:
  title: Hello API
  version: 1.0.0
  description: A basic API that responds with a greeting message

servers:
  - url: /

paths:
  /hello:
    get:
      summary: Get greeting message
      description: Returns a JSON greeting message
      operationId: getHello
      responses:
        '200':
          description: Successful response with greeting
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Hello, World!"
                required:
                  - message

  /health:
    get:
      summary: Health check
      description: Platform readiness probe endpoint
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: "OK"
